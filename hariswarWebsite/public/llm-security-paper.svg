<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="LLM-Enabled Open-Source Systems in the Wild — LLMSC 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.6" stop-color="#1a1446"/>
      <stop offset="1" stop-color="#3a1850"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7fb2ff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- advisory "code" lines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" opacity="0.55">
    <text x="70" y="448" fill="#98c379">GHSA-xxxx: prompt injection → tool call</text>
    <text x="70" y="482" fill="#e5c07b">CWE-502: deserialization of untrusted data</text>
  </g>

  <!-- shield with a neural node graph -->
  <g transform="translate(950 335) scale(0.78)">
    <path d="M0 -190 L150 -130 V10 C150 110 80 175 0 205 C-80 175 -150 110 -150 10 V-130 Z" fill="#0b1026" fill-opacity="0.6" stroke="#22d3ee" stroke-width="6"/>
    <g stroke="#7fe3d3" stroke-width="3" opacity="0.9">
      <line x1="-70" y1="-60" x2="0" y2="-10"/><line x1="70" y1="-60" x2="0" y2="-10"/>
      <line x1="-70" y1="-60" x2="-60" y2="60"/><line x1="70" y1="-60" x2="60" y2="60"/>
      <line x1="0" y1="-10" x2="-60" y2="60"/><line x1="0" y1="-10" x2="60" y2="60"/>
      <line x1="-60" y1="60" x2="0" y2="120"/><line x1="60" y1="60" x2="0" y2="120"/>
    </g>
    <g fill="#22d3ee">
      <circle cx="-70" cy="-60" r="14"/><circle cx="70" cy="-60" r="14"/><circle cx="0" cy="-10" r="18" fill="#ffb46b"/>
      <circle cx="-60" cy="60" r="14"/><circle cx="60" cy="60" r="14"/><circle cx="0" cy="120" r="14"/>
    </g>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff" font-weight="700">
    <text x="70" y="226" font-size="54">LLM-Enabled Open-Source</text>
    <text x="70" y="288" font-size="54">Systems in the Wild</text>
  </g>
  <text x="70" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#c7d2fe">An Empirical Study of Vulnerabilities in GitHub Security Advisories</text>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="22">
    <rect x="70" y="358" width="210" height="44" rx="22" fill="#ffb46b"/>
    <text x="175" y="387" text-anchor="middle" fill="#1a1206">LLMSC 2026</text>
    <rect x="296" y="358" width="200" height="44" rx="22" fill="none" stroke="#7fb2ff"/>
    <text x="396" y="387" text-anchor="middle" fill="#7fb2ff">arXiv 2604.04288</text>
  </g>
</svg>
